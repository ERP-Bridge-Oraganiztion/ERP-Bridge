services:
  mysql:
    image: mysql:8.4
    container_name: erp-bridge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-erp_bridge}
      MYSQL_USER: ${DB_USERNAME:-erp_bridge_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    ports:
      - "3307:3306"
    volumes:
      - erp_bridge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_me_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-nextjs
      dockerfile: Dockerfile
    container_name: erp-bridge-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USERNAME:-erp_bridge_user}:${DB_PASSWORD:-change_me}@mysql:3306/${DB_NAME:-erp_bridge}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-min-32-chars-long-for-hs256}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:-change-this-aes-encryption-master-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
    ports:
      - "8080:8080"

volumes:
  erp_bridge_mysql_data: